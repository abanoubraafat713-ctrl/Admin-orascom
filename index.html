<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تقرير المشروع الشهري</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f1;--sf:#fff;--ink:#14323a;--mut:#5f7a80;--ac:#1f7a6d;--acs:#d8ece8;--wr:#b36b00;--wrs:#fdf0d9;--dn:#b3261e;--bd:#cfdcda;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1f23;--sf:#172c31;--ink:#e6f1ef;--mut:#8fb0b0;--ac:#4fc3b0;--acs:#1d3d3a;--wr:#f0b45a;--wrs:#3a2e17;--dn:#ff8a80;--bd:#2c4a50}}
:root[data-theme="dark"]{--bg:#0f1f23;--sf:#172c31;--ink:#e6f1ef;--mut:#8fb0b0;--ac:#4fc3b0;--acs:#1d3d3a;--wr:#f0b45a;--wrs:#3a2e17;--dn:#ff8a80;--bd:#2c4a50}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;font-size:15px;line-height:1.6}
header{padding:12px 16px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{margin:0;font-size:19px;font-weight:800}
.btn{font:inherit;border:1px solid var(--bd);background:var(--sf);color:var(--ink);padding:6px 12px;border-radius:6px;cursor:pointer}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
.btn.d{color:var(--dn)}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
nav{display:flex;gap:4px;overflow-x:auto;padding:10px 16px 0;border-bottom:2px solid var(--bd)}
nav button{font:inherit;white-space:nowrap;border:0;background:none;color:var(--mut);padding:8px 12px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;font-weight:600}
nav button[aria-selected="true"]{color:var(--ac);border-color:var(--ac)}
main{padding:16px;max-width:1150px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.st{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:10px 12px}
.st b{display:block;font-size:22px;font-weight:800;color:var(--ac)}
.st span{color:var(--mut);font-size:13px}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:14px;margin-bottom:14px}
.box h2{margin:0 0 10px;font-size:16px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:2px}
input,select{font:inherit;padding:7px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center}
.tools input{max-width:260px}
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:8px;background:var(--sf)}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th{background:var(--acs);font-weight:600;font-size:13px}
tr:last-child td{border-bottom:0}
.tag{padding:1px 8px;border-radius:10px;background:var(--acs);font-size:12px}
.tag.w{background:var(--wrs);color:var(--wr);font-weight:600}
.tag.x{background:var(--dn);color:#fff}
.row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.empty{padding:18px;text-align:center;color:var(--mut)}
.login{max-width:340px;margin:8vh auto}
.note{font-size:13px;color:var(--mut)}
.err{color:var(--dn);font-size:13px;min-height:20px}
.brand{text-align:center;margin-bottom:12px}.dept{font-weight:800;font-size:18px;line-height:1.4}.dept small{display:block;font-size:12px;color:var(--mut);font-weight:600;direction:ltr}
.brand img{width:100%;max-width:300px;background:#fff;border-radius:8px;padding:8px;margin-top:8px}.hl{height:36px;background:#fff;border-radius:6px;padding:3px 6px}.login{max-width:400px}
.gi{width:52px;padding:3px 4px;font-size:13px;text-align:center}.sec{display:flex;gap:6px;padding:8px 16px 0;flex-wrap:wrap}.sec .btn[aria-pressed="true"]{background:var(--ac);color:#fff;border-color:var(--ac)}
.bf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:10px 0}td.c{text-align:center}
#pa{display:none}
@media print{@page{size:A4;margin:8mm}html,body{background:#fff!important}body>*:not(#pa){display:none!important}#pa{display:block!important;color:#000;font-size:10px;direction:rtl}
#pa .pg{page-break-after:always;break-after:page}#pa .ph2{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px;border-bottom:2px solid #000;padding-bottom:4px}#pa .ph2 img{height:38px;width:auto}#pa .phc{flex:1;text-align:center;font-size:11px;line-height:1.5}#pa .blk{font-size:10.5px;line-height:1.2}#pa .blk th,#pa .blk td{padding:1px 3px}#pa .blk td{font-weight:600}#pa .stm{font-size:11.5px}#pa .stm th,#pa .stm td{padding:2px 4px}#pa .blk h3{font-size:12px;margin:0 0 2px}#pa .blk table{margin-bottom:3px}#pa .pg:last-child{page-break-after:auto}#pa h3{text-align:center;margin:0 0 4px;font-size:14px}#pa .ph{text-align:center;margin-bottom:5px}
#pa table{border-collapse:collapse;width:100%;margin-bottom:6px}#pa th,#pa td{border:1px solid #000;padding:2px 3px;text-align:center;white-space:normal;background:#fff!important;color:#000!important}#pa th{background:#eee!important;font-weight:700}
#pa .sg{display:flex;justify-content:space-around;margin-top:14px}#pa p{margin:3px 0}}
.cbr{display:flex;align-items:center;gap:8px;margin:5px 0}.cbn{flex:0 0 38%;max-width:260px;text-align:right;background:none;border:0;color:var(--ink);font:inherit;cursor:pointer;padding:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cbn:hover{color:var(--ac);text-decoration:underline}
.cbt{flex:1;background:var(--acs);border-radius:4px;height:16px;overflow:hidden}.cbf{height:100%;background:var(--ac);border-radius:4px}.cbf.w{background:var(--wr)}.cbv{flex:0 0 118px;font-size:12px;color:var(--mut);text-align:left;direction:ltr}
.scr{max-height:430px;overflow-y:auto;padding-left:4px}.tcols{display:flex;gap:6px;align-items:flex-end;overflow-x:auto;padding-bottom:4px}.tcol{flex:0 0 64px;text-align:center;font-size:11px;color:var(--mut)}.tbar{height:150px;display:flex;align-items:flex-end;justify-content:center}.tbar>div{width:34px;background:var(--ac);border-radius:4px 4px 0 0;display:flex;align-items:flex-end}.twaste{width:100%;background:var(--wr);border-radius:0}
.hero{background:linear-gradient(135deg,#0f3d4a,#1f7a6d);color:#fff;border-radius:14px;padding:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.hero h2{margin:0;font-size:20px;font-weight:800}.hero .note{color:#cfe8e4}.hero img{height:34px;background:#fff;border-radius:6px;padding:3px 6px}
.hero select{max-width:150px;background:#fff;color:#14323a}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:12px 0}.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:12px;border-top:4px solid var(--ac)}.kpi.w{border-top-color:var(--wr)}.kpi.b{border-top-color:#3b82c4}.kpi b{font-size:22px;display:block;line-height:1.3}.kpi small{color:var(--mut)}.up{color:var(--dn);font-weight:700}.dn{color:var(--ac);font-weight:700}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:12px;margin-bottom:12px}.grid2 .box{margin:0}.leg{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}.dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-left:6px}.ins{padding:7px 0;border-bottom:1px solid var(--bd);font-size:14px}.ins:last-child{border:0}
.gi.cf{border-color:var(--dn);background:rgba(179,38,30,.18)}
.tb{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-bottom:3px solid #1f7a6d;padding:6px 16px}.tb img{height:34px}.tb span{font-weight:800;color:#14323a;font-size:13px}
.lnk{cursor:pointer}.lnk:hover{background:var(--acs)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.pth img{width:100%;height:100px;object-fit:cover;border-radius:6px;display:block}.pth .btn{width:100%;margin-top:3px}
@media print{#pa .pgp{display:flex;flex-wrap:wrap;gap:4px}#pa .pgp figure{margin:0;text-align:center;font-size:9px}#pa .pgp img{height:95px}}
</style>
</head>
<body>
<div class="tb"><img id="tbl" alt="Orascom Construction"><img id="tbl2" alt="Administrative Services Department"></div>
<header><div id="hb" style="display:flex;align-items:center;gap:10px"><div><div class="note">قسم الشؤون الإدارية — Administrative Services Department</div><h1 id="ttl">تقرير المشروع الشهري</h1></div></div><div id="hr" style="display:flex;gap:6px;align-items:center"></div></header>
<div id="sec" class="sec"></div>
<nav id="nav" role="tablist"></nav>
<main id="main"></main>
<div id="pa"></div><input type="file" id="imp" accept=".xlsx,.xls,.csv" style="display:none">
